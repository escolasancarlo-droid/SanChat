<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanchat</title>
<style>
:root{--bg:#efeae2;--panel:#fff;--head:#075e54;--me:#d9fdd3;--other:#fff;--txt:#111b21;--sub:#667781;--acc:#00a884;--line:#e9edef}
@media(prefers-color-scheme:dark){:root{--bg:#0b141a;--panel:#111b21;--head:#202c33;--me:#005c4b;--other:#202c33;--txt:#e9edef;--sub:#8696a0;--line:#222d34}}
*{box-sizing:border-box;margin:0}
html,body{height:100%;font:15px system-ui,sans-serif;color:var(--txt);background:var(--bg)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
#login{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
#login div{background:var(--panel);padding:32px;border-radius:12px;width:100%;max-width:360px;display:grid;gap:14px;text-align:center}
#login h1{color:var(--acc);font-size:28px}
#login p{color:var(--sub)}
.btn{background:var(--acc);color:#fff;padding:12px;border-radius:8px;font-weight:600}
#err{color:#e53935;font-size:13px}
#app{display:none;height:100%;flex-direction:column;max-width:900px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
header{background:var(--head);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
header strong{flex:1;font-size:17px}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;object-fit:cover;font-size:14px}
#msgs{flex:1;overflow:auto;padding:12px 5%;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:8px;align-items:flex-end}
.row.me{flex-direction:row-reverse}
.row .av{width:28px;height:28px;font-size:12px}
.m{max-width:75%;padding:6px 9px;border-radius:8px;background:var(--other);box-shadow:0 1px 1px rgba(0,0,0,.13);word-wrap:break-word;white-space:pre-wrap}
.me .m{background:var(--me)}
.m b{display:block;font-size:12.5px;color:var(--acc)}
.m img{max-width:100%;max-height:300px;border-radius:6px;display:block;margin:3px 0;cursor:pointer}
.m audio{width:230px;max-width:100%;height:40px}
.m i{display:block;text-align:right;font-size:11px;color:var(--sub);font-style:normal}
.day{align-self:center;background:var(--panel);color:var(--sub);font-size:12px;padding:3px 10px;border-radius:8px;margin:8px 0}
#more{align-self:center;color:var(--acc);padding:6px 14px;font-weight:600}
#bar{display:flex;gap:8px;align-items:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--panel)}
#txt{flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:20px;background:var(--bg);color:var(--txt);font:inherit}
.ic{width:42px;height:42px;border-radius:50%;font-size:19px;flex:none}
.ic.send{background:var(--acc);color:#fff}
.ic.rec{background:#e53935;color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.5}}
@media(max-width:700px){.m{max-width:80%}#msgs{padding:10px}}
@media(prefers-reduced-motion:reduce){.ic.rec{animation:none}}
</style>
</head>
<body>

<div id="login">
  <div>
    <h1>Sanchat</h1>
    <p>Um chat único para todo mundo. Entre com sua conta Google.</p>
    <button class="btn" onclick="signIn()">Entrar com Google</button>
    <p id="err"></p>
  </div>
</div>

<div id="app">
  <header>
    <strong>Sanchat</strong>
    <button id="bell" onclick="askNotif()" title="Notificações" style="font-size:18px">🔕</button>
    <img class="av" id="me" alt="" referrerpolicy="no-referrer">
    <button onclick="signOut()" style="font-size:13px">Sair</button>
  </header>
  <div id="msgs"></div>
  <div id="bar">
    <label class="ic" style="display:grid;place-items:center;cursor:pointer" title="Enviar imagem">📎<input type="file" id="file" accept="image/*" hidden></label>
    <input id="txt" type="text" placeholder="Mensagem" autocomplete="off">
    <button class="ic send" onclick="sendText()" title="Enviar">➤</button>
    <button class="ic" id="micBtn" onclick="toggleRec()" title="Gravar áudio (máx. 60s)">🎤</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC7gIGHxZIX5p4GqW7G7UgO7xa8nCr78AQ",
  authDomain: "sanchat-b4e05.firebaseapp.com",
  projectId: "sanchat-b4e05",
  storageBucket: "sanchat-b4e05.firebasestorage.app",
  messagingSenderId: "649236804530",
  appId: "1:649236804530:web:ea8c37d34a554472ddaaab"
};
const $ = id => document.getElementById(id);
const MAX_DOC = 900 * 1024;   // Firestore: 1 MiB por documento
const PAGE = 50;
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();
const col = db.collection('messages');
let user = null, unsub = null, limit = PAGE, first = true, unread = 0, swReg = null, ac = null;

/* ---------- Login ---------- */
async function signIn(){
  $('err').textContent = '';
  const p = new firebase.auth.GoogleAuthProvider();
  try { await auth.signInWithPopup(p) }
  catch(e){
    if(e.code === 'auth/popup-blocked') return auth.signInWithRedirect(p);
    if(e.code === 'auth/unauthorized-domain') $('err').textContent = 'Domínio não autorizado: adicione-o em Authentication → Configurações → Domínios autorizados.';
    else if(e.code === 'auth/operation-not-allowed') $('err').textContent = 'Ative o provedor Google em Authentication → Método de login.';
    else if(e.code !== 'auth/popup-closed-by-user') $('err').textContent = e.message;
  }
}
function signOut(){ auth.signOut() }
auth.onAuthStateChanged(u => {
  user = u;
  if(unsub){ unsub(); unsub = null }
  $('login').style.display = u ? 'none' : 'flex';
  $('app').style.display = u ? 'flex' : 'none';
  if(!u) return;
  $('me').src = u.photoURL || '';
  limit = PAGE; first = true;
  subscribe();
  initNotif();
});

/* ---------- Mensagens ---------- */
function subscribe(){
  if(unsub) unsub();
  unsub = col.orderBy('ts', 'desc').limit(limit).onSnapshot(snap => {
    const box = $('msgs');
    const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
    const prevH = box.scrollHeight;
    const docs = snap.docs.slice().reverse();
    box.innerHTML = '';
    if(snap.size >= limit){
      const b = document.createElement('button'); b.id = 'more'; b.textContent = 'Carregar mensagens anteriores';
      b.onclick = () => { limit += PAGE; loadingOlder = true; subscribe() };
      box.appendChild(b);
    }
    let day = '';
    docs.forEach(d => {
      const m = d.data({ serverTimestamps: 'estimate' });
      const dt = m.ts.toDate().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
      if(dt !== day){ day = dt; const s = document.createElement('div'); s.className = 'day'; s.textContent = dt; box.appendChild(s) }
      box.appendChild(bubble(m));
    });
    if(loadingOlder){ box.scrollTop = box.scrollHeight - prevH; loadingOlder = false }
    else if(atEnd || first) box.scrollTop = box.scrollHeight;
    if(!first) snap.docChanges().forEach(c => {
      if(c.type === 'added' && !c.doc.metadata.hasPendingWrites && c.doc.data().uid !== user.uid) incoming(c.doc.data());
    });
    first = false;
  }, e => { $('msgs').textContent = 'Erro ao ler mensagens: ' + e.message });
}
let loadingOlder = false;

function bubble(m){
  const mine = m.uid === user.uid;
  const row = document.createElement('div');
  row.className = 'row' + (mine ? ' me' : '');
  if(!mine){
    let a;
    if(m.photo){ a = document.createElement('img'); a.src = m.photo; a.referrerPolicy = 'no-referrer'; a.alt = '' }
    else { a = document.createElement('div'); a.textContent = (m.name || '?')[0].toUpperCase() }
    a.className = 'av'; row.appendChild(a);
  }
  const el = document.createElement('div'); el.className = 'm';
  if(!mine){ const n = document.createElement('b'); n.textContent = m.name; el.appendChild(n) }
  if(m.type === 'image'){
    const im = document.createElement('img'); im.src = m.data; im.alt = 'Imagem';
    im.onclick = () => { const w = window.open(); if(w) w.document.write('<img src="' + m.data + '" style="max-width:100%">') };
    el.appendChild(im);
  } else if(m.type === 'audio'){
    const a = document.createElement('audio'); a.controls = true; a.src = m.data; el.appendChild(a);
  } else el.appendChild(document.createTextNode(m.text || ''));
  const t = document.createElement('i');
  t.textContent = m.ts.toDate().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  el.appendChild(t); row.appendChild(el);
  return row;
}

async function post(payload){
  try {
    await col.add({ uid: user.uid, name: user.displayName || user.email, photo: user.photoURL || '',
      ts: firebase.firestore.FieldValue.serverTimestamp(), ...payload });
  } catch(e){ toast('Não foi possível enviar: ' + e.message) }
}
function sendText(){
  const v = $('txt').value.trim();
  if(!v) return;
  $('txt').value = '';
  post({ type: 'text', text: v.slice(0, 4000) });
}
$('txt').addEventListener('keydown', e => { if(e.key === 'Enter') sendText() });

/* Imagens: reduz e comprime em JPEG até caber no limite do documento */
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try {
    const bmp = await createImageBitmap(f);
    let max = 1000, q = 0.7, url;
    do {
      const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas');
      c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      url = c.toDataURL('image/jpeg', q);
      max *= 0.8; q = Math.max(0.4, q - 0.1);
    } while(url.length > MAX_DOC && max > 200);
    if(url.length > MAX_DOC) return toast('Imagem muito grande.');
    post({ type: 'image', data: url });
  } catch { toast('Não foi possível ler essa imagem.') }
});

/* Áudio: MediaRecorder a ~24 kbps, limite de 60s */
let rec = null, chunks = [], stopT = null;
async function toggleRec(){
  if(rec){ rec.stop(); return }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    rec = new MediaRecorder(stream, { audioBitsPerSecond: 24000 });
    chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = async () => {
      clearTimeout(stopT);
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: rec.mimeType });
      rec = null; $('micBtn').className = 'ic'; $('micBtn').textContent = '🎤';
      const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob) });
      if(url.length > MAX_DOC) return toast('Áudio muito longo.');
      post({ type: 'audio', data: url });
    };
    rec.start();
    $('micBtn').className = 'ic rec'; $('micBtn').textContent = '⏹';
    stopT = setTimeout(() => rec && rec.stop(), 60000);
  } catch { toast('Permita o acesso ao microfone (a página precisa estar em HTTPS).') }
}

/* ---------- Notificações (funcionam com o app aberto, mesmo em segundo plano) ---------- */
function incoming(m){
  if(!document.hidden) return;
  unread++; updateTitle(); beep();
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const body = m.type === 'image' ? '📷 Imagem' : m.type === 'audio' ? '🎤 Áudio' : (m.text || '').slice(0, 120);
  const opts = { body, tag: 'sanchat', icon: m.photo || undefined };
  if(swReg) swReg.showNotification(m.name, opts);
  else { const n = new Notification(m.name, opts); n.onclick = () => { window.focus(); n.close() } }
}
function updateTitle(){
  document.title = unread ? '(' + unread + ') Sanchat' : 'Sanchat';
  if(navigator.setAppBadge){ unread ? navigator.setAppBadge(unread).catch(() => {}) : navigator.clearAppBadge().catch(() => {}) }
}
function beep(){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(.15, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .25);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .25);
  } catch {}
}
async function askNotif(){
  if(!('Notification' in window)) return toast('Este navegador não suporta notificações.');
  if(Notification.permission === 'denied') return toast('Notificações bloqueadas. Libere nas configurações do site.');
  await Notification.requestPermission();
  initNotif();
}
function initNotif(){
  const ok = 'Notification' in window && Notification.permission === 'granted';
  $('bell').textContent = ok ? '🔔' : '🔕';
  if(ok && 'serviceWorker' in navigator && !swReg) navigator.serviceWorker.register('sw.js').then(r => swReg = r).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if(!document.hidden){ unread = 0; updateTitle() } });

function toast(t){
  const d = document.createElement('div');
  d.textContent = t;
  d.style.cssText = 'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:8px;z-index:9;max-width:90%';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 4000);
}
</script>
</body>
</html>
